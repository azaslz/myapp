<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memo Flow</title><link rel="stylesheet" href="style.css"></head><body><div id="loginScreen" class="login-screen"><div class="login-card"><b>✦</b><small>PRIVATE SPACE</small><h1>Memo Flow</h1><p id="authLead">メールアドレスとパスワードでログイン</p><form id="loginForm"><input id="loginEmail" type="email" required placeholder="メールアドレス"><input id="loginPassword" type="password" required placeholder="パスワード"><button>ログイン ↗</button></form><form id="signupForm" hidden><input id="signupEmail" type="email" required placeholder="メールアドレス"><input id="signupCode" hidden inputmode="numeric" maxlength="6" placeholder="6桁の認証コード"><input id="signupPassword" hidden type="password" minlength="10" placeholder="10文字以上のパスワード"><button id="signupButton">認証コードを送信 ↗</button></form><button id="authSwitch" class="logout">新規登録はこちら</button><em id="loginError"></em></div></div><div id="app" class="app" hidden><aside><b>✦ Memo Flow</b><small>CHANNELS</small><nav id="channels"></nav><button id="addChannel">＋ チャンネルを追加</button><footer>あなたのための記録場所<br><button id="logout" class="logout">ログアウト</button></footer></aside><main><header><div><small>CHANNEL</small><h1 id="title"># 個人</h1></div><div class="filters"><input id="search" type="search" placeholder="⌕ メモを検索"><input id="filterTag" placeholder="# タグで絞る"></div></header><section id="feed"></section><div id="more"></div><div class="composerWrap"><form id="form"><textarea id="content" rows="3" required placeholder="今、考えていることは？ Markdownも使えます…"></textarea><div><input id="tags" placeholder="タグ（カンマ区切り）"><span>Enterで送信　Shift + Enterで改行</span><button>送信 ↗</button></div></form></div></main></div><div id="toast"></div><script src="app.js"></script></body></html>
