<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memo Flow</title><link rel="stylesheet" href="style.css"></head><body><div id="loginScreen" class="login-screen"><div class="login-card"><b>✦</b><small>PRIVATE SPACE</small><h1>Memo Flow</h1><p>合言葉を入力してください</p><form id="unlockForm"><div class="pwField"><input id="unlockPassword" type="password" required placeholder="パスワード"><button type="button" class="pwToggle" data-target="unlockPassword">表示</button></div><button>開く ↗</button></form><em id="loginError"></em></div></div><div id="app" class="app" hidden><aside><b>✦ Memo Flow</b><small>CHANNELS</small><nav id="channels"></nav><button id="addChannel">＋ チャンネルを追加</button><footer>あなたのための記録場所<br><button id="logout" class="logout">ログアウト</button></footer></aside><main><header><div><small>CHANNEL</small><h1 id="title"></h1></div><div class="filters"><input id="search" type="search" placeholder="⌕ メモを検索"></div></header><div id="filterTags" class="filterTags"></div><section id="feed"></section><div id="more"></div><div class="composerWrap"><form id="form"><textarea id="content" rows="3" required placeholder="今、考えていることは？ Markdownも使えます…"></textarea><div><input id="tags" placeholder="タグ（カンマ区切り）"><span>Ctrl + Enterで送信　Enterで改行</span><button>送信 ↗</button></div></form></div></main></div><div id="toast"></div><script src="app.js"></script></body></html>
